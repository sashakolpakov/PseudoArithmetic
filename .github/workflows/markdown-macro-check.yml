name: Markdown macro check

on:
  push:
  pull_request:

jobs:
  reject-unsupported-macros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject operatorname in Markdown
        shell: bash
        run: |
          if rg -n -F -g '*.md' '\operatorname' .; then
            echo 'Unsupported Markdown macro found: \operatorname'
            exit 1
          fi
